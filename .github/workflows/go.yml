name: Go package

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Build directly from the checkout: consumers do not run npm before import.
      - run: go build ./...
      - run: go test ./...
